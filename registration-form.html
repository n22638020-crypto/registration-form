<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      background: #f3f6fb;
      color: #1e293b;
      font-family: system-ui, sans-serif;
    }

    .card {
      width: min(100%, 440px);
      padding: 32px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      box-shadow: 0 12px 36px rgb(15 23 42 / 8%);
    }

    h1 { margin: 0 0 8px; font-size: 1.7rem; }
    .intro { margin: 0 0 24px; color: #64748b; }

    label {
      display: block;
      margin: 16px 0 6px;
      font-weight: 600;
      font-size: 0.94rem;
    }

    input {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font: inherit;
    }

    input:focus {
      outline: 3px solid rgb(37 99 235 / 20%);
      border-color: #2563eb;
    }

    .hint { margin: 6px 0 0; color: #64748b; font-size: 0.85rem; }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 18px 0;
      color: #475569;
      font-size: 0.9rem;
    }

    .terms input { width: 18px; min-height: 18px; margin: 2px 0 0; }

    button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 7px;
      background: #1d4ed8;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #1e40af; }
    button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }

    @media (max-width: 480px) {
      body { padding: 14px; }
      .card { padding: 24px 20px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Create your account</h1>
    <p class="intro">Fill in your details to register.</p>

    <form action="/register" method="post">
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" autocomplete="name"
             required maxlength="100">

      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email"
             required maxlength="254">

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="new-password" required minlength="12"
             aria-describedby="password-hint">
      <p class="hint" id="password-hint">Use at least 12 characters.</p>

      <label for="confirm-password">Confirm password</label>
      <input id="confirm-password" name="confirm_password" type="password"
             autocomplete="new-password" required minlength="12">

      <label class="terms">
        <input name="terms" type="checkbox" required>
        <span>I agree to the terms and privacy policy.</span>
      </label>

      <button type="submit">Register</button>
    </form>
  </main>

  <script>
    const form = document.querySelector("form");
    const password = document.querySelector("#password");
    const confirmation = document.querySelector("#confirm-password");

    function checkPasswords() {
      confirmation.setCustomValidity(
        confirmation.value && confirmation.value !== password.value
          ? "Passwords do not match."
          : ""
      );
    }

    password.addEventListener("input", checkPasswords);
    confirmation.addEventListener("input", checkPasswords);
  </script>
</body>
</html>
